<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>로드킬 예방 내비게이션 (카카오맵)</title>
<style>
:root {
  --safe: #03a24a;
  --warn: #f59f00;
  --danger: #e03131;
  --route-edge: #02853b;
  --car: #2b6cff;
  --ink: #171b1f;
  --ink-soft: #59636e;
  --sheet: #ffffff;
  --line: #e2e7ea;
  --chip: #eef2f4;
  --sheet-h: 250px;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
[hidden] { display: none !important; }
html { height: 100%; background: #e5eaed; }
body {
  height: 100%; margin: 0; overflow: hidden; color: var(--ink); background: #e5eaed;
  font-family: "Pretendard", -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Segoe UI", sans-serif;
  -webkit-text-size-adjust: 100%; touch-action: manipulation;
}
button, input { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--car); outline-offset: 2px; }

#app { position: relative; height: 100%; overflow: hidden; }
#map { position: absolute; left: 0; right: 0; top: 0; bottom: var(--sheet-h); background: #e5eaed; }

.edge { position: absolute; inset: 0; pointer-events: none; z-index: 5; transition: box-shadow .25s; }
.edge.warn { box-shadow: inset 0 0 36px 4px rgba(245, 159, 0, .5); }
.edge.danger { animation: edgepulse .55s ease-in-out infinite alternate; }
@keyframes edgepulse {
  from { box-shadow: inset 0 0 22px 2px rgba(224, 49, 49, .35); }
  to   { box-shadow: inset 0 0 52px 10px rgba(224, 49, 49, .7); }
}

.top { position: absolute; left: 10px; right: 10px; top: 10px; z-index: 6; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.top > * { pointer-events: auto; }
.status {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 14px;
  background: #0b7a3b; color: #fff; border-radius: 16px; box-shadow: 0 4px 14px rgba(0, 0, 0, .22);
}
.status-body { flex: 1; min-width: 0; }
.status-title { font-size: 18px; font-weight: 800; letter-spacing: -0.01em; }
.status-sub { font-size: 13px; font-weight: 600; opacity: .92; margin-top: 2px; }
.icon-btn { flex: none; width: 44px; height: 44px; border: 0; border-radius: 12px; background: rgba(255, 255, 255, .18); color: #fff; font-size: 20px; cursor: pointer; }

.alert { display: flex; align-items: center; gap: 10px; border-radius: 14px; padding: 10px 14px; box-shadow: 0 4px 14px rgba(0, 0, 0, .22); }
.alert.safe   { background: var(--safe);   color: #fff; }
.alert.warn   { background: var(--warn);   color: #171b1f; }
.alert.danger { background: var(--danger); color: #fff; }
.alert-ico { font-size: 26px; line-height: 1; }
.alert-title { font-size: 18px; font-weight: 800; letter-spacing: -0.01em; }
.alert-sub { font-size: 13px; font-weight: 600; opacity: .9; margin-top: 1px; }

.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 6;
  background: var(--sheet); border-radius: 20px 20px 0 0; padding: 12px 14px;
  box-shadow: 0 -6px 20px rgba(0, 0, 0, .16);
}
.stats { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; }
.stat-v { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
.stat-l { font-size: 12px; color: var(--ink-soft); margin-top: 1px; }
.sim { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; gap: 8px; align-items: center; }
.seg { display: flex; gap: 4px; }
.chip, .btn { border: 0; border-radius: 10px; min-height: 40px; padding: 0 12px; background: var(--chip); font-size: 14px; font-weight: 600; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: #fff; }
.seg.grow { flex: 1; }
.seg.grow .chip { flex: 1; padding: 0 6px; }
.btn.primary { flex: 1; background: var(--route-edge); color: #fff; font-weight: 800; }
.speed { flex: 1; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-soft); }
.speed input { flex: 1; min-width: 0; height: 32px; accent-color: var(--route-edge); }
.speed b { color: var(--ink); min-width: 52px; text-align: right; font-weight: 700; }

.searchbar { display: flex; gap: 8px; align-items: center; background: #fff; border-radius: 14px; padding: 6px 6px 6px 14px; box-shadow: 0 4px 14px rgba(0, 0, 0, .16); }
.searchbar input { flex: 1; min-width: 0; border: 0; background: transparent; font-size: 15px; min-height: 38px; }
.searchbar input:focus { outline: 0; }
.searchbar button { border: 0; border-radius: 10px; background: var(--route-edge); color: #fff; font-weight: 700; min-height: 38px; padding: 0 14px; cursor: pointer; }
.results { background: #fff; border-radius: 14px; box-shadow: 0 4px 14px rgba(0, 0, 0, .16); max-height: 220px; overflow-y: auto; }
.results button { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: #fff; padding: 10px 14px; font-size: 14px; cursor: pointer; }
.results button:last-child { border-bottom: 0; }
.rname { font-weight: 700; }
.raddr { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
.turnbar { display: flex; align-items: center; gap: 10px; background: var(--ink); color: #fff; border-radius: 14px; padding: 10px 14px; box-shadow: 0 4px 14px rgba(0, 0, 0, .22); }
.turnbar .ti { font-size: 26px; flex: none; }
.turnbar .td { font-size: 20px; font-weight: 800; letter-spacing: -0.01em; }
.turnbar .tt { font-size: 13px; opacity: .85; margin-top: 1px; }
.dpin { font-size: 30px; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .35)); }

/* 지도 위 표시 */
.car { width: 60px; height: 60px; }
.car svg { display: block; transition: transform .15s linear; }
.animal { position: relative; width: 44px; height: 44px; }
.a-disc {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  background: #fff; border: 4px solid var(--safe); border-radius: 50%; font-size: 24px; box-sizing: border-box;
}
.a-disc::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 3px solid currentColor; animation: ring 1.1s ease-out infinite; }
.animal.safe { color: var(--safe); } .animal.safe .a-disc { border-color: var(--safe); }
.animal.warn { color: var(--warn); } .animal.warn .a-disc { border-color: var(--warn); }
.animal.danger { color: var(--danger); } .animal.danger .a-disc { border-color: var(--danger); }
@keyframes ring { from { transform: scale(1); opacity: .9; } to { transform: scale(1.9); opacity: 0; } }
.a-pill {
  position: absolute; left: 50%; bottom: 100%; transform: translateX(-50%); margin-bottom: 6px;
  padding: 3px 10px; border-radius: 13px; font-size: 15px; font-weight: 800; white-space: nowrap; color: #fff; background: var(--safe);
}
.animal.warn .a-pill { background: var(--warn); color: #171b1f; }
.animal.danger .a-pill { background: var(--danger); }

/* 처음 설정 화면 */
.setup { position: absolute; inset: 0; z-index: 20; background: #f3f6f7; overflow-y: auto; padding: 18px 16px 28px; }
.setup h1 { font-size: 22px; margin: 8px 0 4px; letter-spacing: -0.02em; }
.setup p { margin: 4px 0 12px; color: var(--ink-soft); font-size: 14px; line-height: 1.5; }
.setup ol { margin: 0 0 14px; padding-left: 20px; font-size: 15px; line-height: 1.6; }
.setup li { margin-bottom: 6px; }
.setup .err { background: #fff1f1; color: #a51d1d; border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-bottom: 12px; line-height: 1.5; }
.setup .origin { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 14px; word-break: break-all; margin: 6px 0 14px; font-weight: 700; }
.setup input { width: 100%; box-sizing: border-box; padding: 12px; border-radius: 10px; border: 1px solid #c9d1d6; font-size: 15px; background: #fff; }
.setup .btn { width: 100%; margin-top: 10px; min-height: 46px; }

@media (prefers-reduced-motion: reduce) {
  .edge.danger { animation: none; box-shadow: inset 0 0 40px 8px rgba(224, 49, 49, .6); }
  .a-disc::after { animation: none; }
}
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <div class="edge" id="edge"></div>

  <div class="top">
    <div class="searchbar">
      <input id="destIn" type="text" inputmode="search" placeholder="목적지를 검색해요 (예: 강남역)" aria-label="목적지 검색">
      <button id="destSearch" type="button">검색</button>
    </div>
    <div class="results" id="results" hidden></div>
    <div class="turnbar" id="turnbar" hidden>
      <span class="ti" id="turnIco" aria-hidden="true">⬆️</span>
      <div class="status-body">
        <div class="td" id="turnDist">--</div>
        <div class="tt" id="turnText">목적지를 검색해 보세요</div>
      </div>
      <button class="icon-btn" id="destClear" type="button" aria-label="경로 지우기">✕</button>
    </div>
    <div class="status">
      <div class="status-body">
        <div class="status-title" id="modeTitle">테스트 주행</div>
        <div class="status-sub" id="modeSub">가상 위치에서 달리는 중</div>
      </div>
      <button class="icon-btn" id="muteBtn" type="button" aria-label="안내 소리 끄기" aria-pressed="false">🔊</button>
    </div>
    <div class="alert" id="alert" role="status" aria-live="polite" hidden>
      <span class="alert-ico" id="alertIco" aria-hidden="true">🦌</span>
      <div>
        <div class="alert-title" id="alertTitle"></div>
        <div class="alert-sub" id="alertSub"></div>
      </div>
    </div>
  </div>

  <div class="sheet" id="sheet">
    <div class="stats">
      <div><div class="stat-v" id="speedV">0</div><div class="stat-l">km/h</div></div>
      <div><div class="stat-v" id="headV">북</div><div class="stat-l">진행 방향</div></div>
      <div><div class="stat-v" id="animalV">--</div><div class="stat-l">동물까지</div></div>
    </div>
    <div class="sim">
      <div class="row">
        <div class="seg grow" role="group" aria-label="위치 방식">
          <button class="chip" type="button" data-mode="test" aria-pressed="true">테스트 주행</button>
          <button class="chip" type="button" data-mode="gps" aria-pressed="false">내 위치(GPS)</button>
        </div>
      </div>
      <div class="row">
        <div class="seg" role="group" aria-label="동물이 나타날 위치">
          <button class="chip" type="button" data-side="left" aria-pressed="false">왼쪽</button>
          <button class="chip" type="button" data-side="center" aria-pressed="true">중앙</button>
          <button class="chip" type="button" data-side="right" aria-pressed="false">오른쪽</button>
        </div>
        <button class="btn primary" id="spawnBtn" type="button">🦌 동물 출현</button>
        <button class="btn" id="clearBtn" type="button">치우기</button>
      </div>
      <div class="row" id="testRow">
        <label class="speed">속도
          <input id="speedIn" type="range" min="0" max="80" step="5" value="40">
          <b id="speedOut">40km/h</b>
        </label>
        <button class="btn" id="turnL" type="button" aria-label="왼쪽으로 15도 돌기">◀</button>
        <button class="btn" id="turnR" type="button" aria-label="오른쪽으로 15도 돌기">▶</button>
        <button class="btn" id="pauseBtn" type="button" aria-pressed="false">정지</button>
      </div>
    </div>
  </div>

  <div class="setup" id="setup" hidden>
    <h1>카카오맵 연결하기</h1>
    <p>처음 한 번만 설정하면 돼요. 키는 이 기기에만 저장돼요.</p>
    <div class="err" id="setupErr" hidden></div>
    <ol>
      <li>developers.kakao.com에서 로그인하고 앱을 만들어요.</li>
      <li>앱의 [카카오맵] 메뉴에서 사용 설정을 ON으로 바꿔요.</li>
      <li>[플랫폼 키]의 JavaScript 키를 복사하고, 그 키의 JavaScript SDK 도메인에 아래 주소를 등록해요.</li>
      <li>복사한 키를 아래에 붙여넣고 저장해요.</li>
    </ol>
    <div>등록할 주소</div>
    <div class="origin" id="setupOrigin"></div>
    <input id="keyIn" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="JavaScript 키 붙여넣기" aria-label="JavaScript 키">
    <button class="btn primary" id="keySave" type="button">저장하고 지도 열기</button>
  </div>
</div>

<script>
(() => {
  'use strict';

  /* JavaScript 키를 코드에 직접 넣고 싶다면 아래 따옴표 안에 붙여넣어도 돼요.
     비워 두면 처음 실행할 때 화면에서 입력받아요. */
  const KAKAO_JS_KEY = '';

  /* ------------------------------------------------------------------
   * 센서 데이터 형식 (나중에 블루투스로 받을 값도 이 모양으로 맞추면 됨)
   *   { detected, distance(m), forward(m), right(m) }
   * 블루투스 연결 시 센서 값이 올 때마다 sensor.latest 를 갱신하면
   * 지도 표시와 경고는 그대로 동작한다. 지금은 시뮬레이터가 값을 만든다.
   * ------------------------------------------------------------------ */
  const sensor = { source: 'simulator', latest: { detected: false } };
  const SENSOR_RANGE = 115;
  const M_PER_DEG = 111320;

  const $ = (id) => document.getElementById(id);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rad = (d) => d * Math.PI / 180;
  const COLORS = { safe: '#03a24a', warn: '#f59f00', danger: '#e03131' };

  const state = {
    mode: 'test', lat: 37.5645, lng: 126.9780, heading: 352, speed: 40,
    side: 'center', muted: false, paused: false, gpsMsg: '', headingKnown: true
  };
  let animal = null;   // { lat, lng }
  let prevLevel = null;
  let lastBeep = 0;
  let route = null;    // { coords, cum, steps, total, destName, destLat, destLng }
  let routeSetAt = 0;

  function levelOf(d) { return d < 30 ? 'danger' : d < 60 ? 'warn' : 'safe'; }
  function dirName(h) {
    const n = ['북', '북동', '동', '남동', '남', '남서', '서', '북서'];
    return n[Math.round((((h % 360) + 360) % 360) / 45) % 8];
  }
  function fmtDist(m) { return m >= 1000 ? (m / 1000).toFixed(1) + 'km' : Math.max(0, Math.round(m / 10) * 10) + 'm'; }
  function distM(lat1, lng1, lat2, lng2) {
    const avgLat = rad((lat1 + lat2) / 2);
    const dLat = (lat2 - lat1) * M_PER_DEG, dLng = (lng2 - lng1) * M_PER_DEG * Math.cos(avgLat);
    return Math.hypot(dLat, dLng);
  }
  function bearingDeg(lat1, lng1, lat2, lng2) {
    const cosA = Math.cos(rad((lat1 + lat2) / 2));
    const east = (lng2 - lng1) * M_PER_DEG * cosA, north = (lat2 - lat1) * M_PER_DEG;
    return (Math.atan2(east, north) * 180 / Math.PI + 360) % 360;
  }
  function angDiff(b1, b2) { return ((b2 - b1 + 540) % 360) - 180; }
  function classifyTurn(diff) {
    const a = Math.abs(diff);
    if (a < 20) return null;
    if (a > 150) return { ico: '↩️', text: '유턴' };
    if (diff > 0) return a < 55 ? { ico: '➡️', text: '우측 방향으로' } : a < 110 ? { ico: '➡️', text: '우회전' } : { ico: '➡️', text: '급우회전' };
    return a < 55 ? { ico: '⬅️', text: '좌측 방향으로' } : a < 110 ? { ico: '⬅️', text: '좌회전' } : { ico: '⬅️', text: '급좌회전' };
  }
  function nearestNode(lat, lng, nodeCoord) {
    let best = null, bestD = Infinity;
    nodeCoord.forEach((c, id) => { const d = distM(lat, lng, c.lat, c.lng); if (d < bestD) { bestD = d; best = id; } });
    return best;
  }
  function dijkstra(start, end, adj) {
    const dist = new Map([[start, 0]]), prev = new Map(), visited = new Set();
    while (true) {
      let u = null, best = Infinity;
      dist.forEach((d, id) => { if (!visited.has(id) && d < best) { best = d; u = id; } });
      if (u === null || u === end) break;
      visited.add(u);
      (adj.get(u) || []).forEach(([v, w]) => {
        const nd = best + w;
        if (nd < (dist.get(v) ?? Infinity)) { dist.set(v, nd); prev.set(v, u); }
      });
    }
    if (!dist.has(end)) return null;
    const path = [end]; let cur = end;
    while (cur !== start) { cur = prev.get(cur); if (cur === undefined) return null; path.push(cur); }
    path.reverse();
    return path;
  }

  /* ---------- 좌표 계산 ---------- */
  function offsetLatLng(lat, lng, heading, forward, right) {
    const h = rad(heading);
    const east = forward * Math.sin(h) + right * Math.cos(h);
    const north = forward * Math.cos(h) - right * Math.sin(h);
    return { lat: lat + north / M_PER_DEG, lng: lng + east / (M_PER_DEG * Math.cos(rad(lat))) };
  }
  function computeSensor() {
    if (!animal) { sensor.latest = { detected: false }; return; }
    const north = (animal.lat - state.lat) * M_PER_DEG;
    const east = (animal.lng - state.lng) * M_PER_DEG * Math.cos(rad(state.lat));
    const h = rad(state.heading);
    const forward = north * Math.cos(h) + east * Math.sin(h);
    const right = east * Math.cos(h) - north * Math.sin(h);
    const distance = Math.hypot(forward, right);
    if (forward < -12) { animal = null; prevLevel = null; sensor.latest = { detected: false }; return; }
    sensor.latest = { detected: forward > -2 && distance <= SENSOR_RANGE, distance, forward, right };
  }
  function spawn() {
    const lateral = state.side === 'left' ? -6 : state.side === 'right' ? 6 : 0;
    animal = offsetLatLng(state.lat, state.lng, state.heading, 105, lateral);
    prevLevel = null;
    ensureAudio();
  }

  /* ---------- 목적지 검색 & 실제 길찾기 ----------
   * 장소 검색은 카카오 Places(키워드 검색)를 쓰고,
   * 실제 도로 경로는 OpenStreetMap의 무료 도로 데이터(Overpass API)를 받아와
   * 직접 구현한 다익스트라 최단 경로 알고리즘으로 계산한다.
   * 카카오의 자동차 길찾기 API는 제휴 계약이 필요해 개인 키로는 못 쓴다. */
  let places = null;
  function doSearch() {
    const q = $('destIn').value.trim();
    if (!q || !places) return;
    places.keywordSearch(q, (data, status) => {
      const box = $('results');
      box.innerHTML = ''; box.hidden = false;
      if (status !== kakao.maps.services.Status.OK || !data.length) {
        const b = document.createElement('button'); b.type = 'button'; b.disabled = true; b.textContent = '검색 결과가 없어요';
        box.appendChild(b); return;
      }
      data.slice(0, 6).forEach((p) => {
        const b = document.createElement('button'); b.type = 'button';
        b.innerHTML = '<div class="rname"></div><div class="raddr"></div>';
        b.querySelector('.rname').textContent = p.place_name;
        b.querySelector('.raddr').textContent = p.road_address_name || p.address_name || '';
        b.addEventListener('click', () => fetchRoute(state.lat, state.lng, +p.y, +p.x, p.place_name));
        box.appendChild(b);
      });
    });
  }
  async function fetchRoute(fromLat, fromLng, toLat, toLng, name) {
    const btn = $('destSearch'); btn.disabled = true; btn.textContent = '경로 계산 중';
    try {
      const straight = distM(fromLat, fromLng, toLat, toLng);
      const margin = Math.max(500, straight * 0.4);
      const avgLat = rad((fromLat + toLat) / 2);
      const dLat = margin / M_PER_DEG, dLng = margin / (M_PER_DEG * Math.cos(avgLat));
      const south = Math.min(fromLat, toLat) - dLat, north = Math.max(fromLat, toLat) + dLat;
      const west = Math.min(fromLng, toLng) - dLng, east = Math.max(fromLng, toLng) + dLng;
      const q = '[out:json][timeout:25];way["highway"~"^(motorway|trunk|primary|secondary|tertiary|unclassified|residential|living_street|service|motorway_link|trunk_link|primary_link|secondary_link|tertiary_link)$"](' +
        south + ',' + west + ',' + north + ',' + east + ');(._;>;);out skel qt;';
      const res = await fetch('https://overpass-api.de/api/interpreter?data=' + encodeURIComponent(q));
      const data = await res.json();
      const nodeCoord = new Map(), adj = new Map();
      const addEdge = (a, b, w) => { if (!adj.has(a)) adj.set(a, []); adj.get(a).push([b, w]); };
      (data.elements || []).forEach((el) => { if (el.type === 'node') nodeCoord.set(el.id, { lat: el.lat, lng: el.lon }); });
      (data.elements || []).forEach((el) => {
        if (el.type === 'way' && el.nodes) {
          for (let i = 0; i < el.nodes.length - 1; i++) {
            const a = el.nodes[i], b = el.nodes[i + 1];
            const ca = nodeCoord.get(a), cb = nodeCoord.get(b);
            if (!ca || !cb) continue;
            const w = distM(ca.lat, ca.lng, cb.lat, cb.lng);
            addEdge(a, b, w); addEdge(b, a, w);
          }
        }
      });
      if (!nodeCoord.size) { alert('이 근처의 도로 정보를 받아오지 못했어요.'); return; }
      const startId = nearestNode(fromLat, fromLng, nodeCoord);
      const endId = nearestNode(toLat, toLng, nodeCoord);
      const path = dijkstra(startId, endId, adj);
      if (!path) { alert('두 지점을 잇는 도로 경로를 찾지 못했어요.'); return; }
      const coords = path.map((id) => nodeCoord.get(id));
      const cum = [0];
      for (let i = 1; i < coords.length; i++) cum.push(cum[i - 1] + distM(coords[i - 1].lat, coords[i - 1].lng, coords[i].lat, coords[i].lng));
      const steps = [];
      for (let i = 1; i < coords.length - 1; i++) {
        const b1 = bearingDeg(coords[i - 1].lat, coords[i - 1].lng, coords[i].lat, coords[i].lng);
        const b2 = bearingDeg(coords[i].lat, coords[i].lng, coords[i + 1].lat, coords[i + 1].lng);
        const turn = classifyTurn(angDiff(b1, b2));
        if (turn) steps.push({ cum: cum[i], ico: turn.ico, text: turn.text });
      }
      route = { coords, cum, steps, total: cum[cum.length - 1], destName: name, destLat: toLat, destLng: toLng };
      routeSetAt = performance.now();
      drawRoute();
    } catch (e) { alert('경로를 계산하지 못했어요. 인터넷 연결을 확인해 주세요.'); }
    finally { btn.disabled = false; btn.textContent = '검색'; }
  }
  function drawRoute() {
    if (!map || !route) return;
    const kk = kakao.maps;
    const path = route.coords.map((c) => new kk.LatLng(c.lat, c.lng));
    routeLine.setPath(path); routeLine.setMap(map);
    destOv.setPosition(new kk.LatLng(route.destLat, route.destLng)); destOv.setMap(map);
    const b = new kk.LatLngBounds();
    path.forEach((p) => b.extend(p));
    map.setBounds(b, 140, 40, 220, 40);
    $('turnbar').hidden = false;
    $('results').hidden = true; $('results').innerHTML = '';
    $('destIn').value = route.destName;
  }
  function clearRoute() {
    route = null;
    if (routeLine) routeLine.setMap(null);
    if (destOv) destOv.setMap(null);
    $('turnbar').hidden = true;
    $('destIn').value = '';
  }
  function nearestOnRoute(carLat, carLng) {
    if (!route) return null;
    let best = null;
    for (let i = 0; i < route.coords.length - 1; i++) {
      const a = route.coords[i], b2 = route.coords[i + 1];
      const cosA = Math.cos(rad(a.lat));
      const bx = (b2.lng - a.lng) * M_PER_DEG * cosA, by = (b2.lat - a.lat) * M_PER_DEG;
      const px = (carLng - a.lng) * M_PER_DEG * cosA, py = (carLat - a.lat) * M_PER_DEG;
      const segLen2 = bx * bx + by * by;
      let t = segLen2 > 1e-6 ? (px * bx + py * by) / segLen2 : 0;
      t = clamp(t, 0, 1);
      const dx = px - bx * t, dy = py - by * t;
      const d = Math.hypot(dx, dy);
      const cum = route.cum[i] + t * (route.cum[i + 1] - route.cum[i]);
      if (!best || d < best.dist) best = { dist: d, cum };
    }
    return best;
  }
  function updateTurn() {
    if (!route) return;
    const near = nearestOnRoute(state.lat, state.lng);
    if (!near) return;
    const remaining = Math.max(0, route.total - near.cum);
    const next = route.steps.find((s) => s.cum > near.cum + 3 && s.text !== '출발');
    if (remaining < 15) {
      setText($('turnIco'), '🏁'); setText($('turnDist'), '도착'); setText($('turnText'), route.destName + ' 근처예요');
    } else if (next) {
      setText($('turnIco'), next.ico); setText($('turnDist'), fmtDist(next.cum - near.cum)); setText($('turnText'), next.text);
    } else {
      setText($('turnIco'), '⬆️'); setText($('turnDist'), fmtDist(remaining)); setText($('turnText'), route.destName + '까지 직진');
    }
  }

  /* ---------- 소리·진동·음성 ---------- */
  let actx = null;
  function ensureAudio() {
    try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.resume) actx.resume(); } catch (e) { /* ignore */ }
  }
  function beep(freq, dur) {
    if (!actx || state.muted) return;
    try {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.25, actx.currentTime + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur + 0.02);
    } catch (e) { /* ignore */ }
  }
  function speak(text) {
    if (state.muted) return;
    try { const u = new SpeechSynthesisUtterance(text); u.lang = 'ko-KR'; u.rate = 1.05; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) { /* ignore */ }
  }
  function buzz(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) { /* ignore */ } }
  function alertFeedback(now) {
    const p = sensor.latest;
    if (!p.detected) { prevLevel = null; return; }
    const lvl = levelOf(p.distance);
    const d10 = Math.max(10, Math.round(p.distance / 10) * 10);
    if (lvl !== prevLevel) {
      if (lvl === 'safe') speak('전방 ' + d10 + '미터에 야생동물이 있어요');
      else if (lvl === 'warn') speak('야생동물이 가까워요. 속도를 줄이세요');
      else speak('위험! 전방 ' + d10 + '미터 야생동물');
      prevLevel = lvl;
    }
    const gap = lvl === 'danger' ? 350 : lvl === 'warn' ? 900 : 0;
    if (gap && now - lastBeep > gap) {
      lastBeep = now;
      beep(lvl === 'danger' ? 1040 : 740, 0.14);
      buzz(lvl === 'danger' ? [120, 60, 120] : 60);
    }
  }

  /* ---------- 위치: 테스트 주행 / GPS ---------- */
  let gpsId = null, prevFix = null;
  function startGps() {
    if (!navigator.geolocation) { state.gpsMsg = '이 브라우저는 위치 기능을 지원하지 않아요'; return; }
    if (window.isSecureContext === false) { state.gpsMsg = 'https 주소에서만 GPS를 쓸 수 있어요'; return; }
    state.gpsMsg = '내 위치를 찾는 중이에요';
    prevFix = null;
    gpsId = navigator.geolocation.watchPosition(onPos, onPosErr, { enableHighAccuracy: true, maximumAge: 1000, timeout: 20000 });
  }
  function stopGps() { if (gpsId != null) { navigator.geolocation.clearWatch(gpsId); gpsId = null; } }
  function onPos(pos) {
    const c = pos.coords;
    if (prevFix) {
      const n = (c.latitude - prevFix.lat) * M_PER_DEG;
      const e = (c.longitude - prevFix.lng) * M_PER_DEG * Math.cos(rad(c.latitude));
      if (Math.hypot(n, e) > 3) {
        state.heading = (Math.atan2(e, n) * 180 / Math.PI + 360) % 360;
        state.headingKnown = true;
        prevFix = { lat: c.latitude, lng: c.longitude };
      }
    } else { prevFix = { lat: c.latitude, lng: c.longitude }; state.headingKnown = false; }
    if (c.heading != null && !isNaN(c.heading) && (c.speed || 0) > 1) { state.heading = c.heading; state.headingKnown = true; }
    state.lat = c.latitude; state.lng = c.longitude;
    state.speed = c.speed != null && !isNaN(c.speed) ? c.speed * 3.6 : 0;
    state.gpsMsg = state.headingKnown ? '내 위치를 따라가는 중이에요' : '조금 움직이면 진행 방향이 잡혀요';
  }
  function onPosErr(err) {
    state.gpsMsg = err.code === 1 ? '위치 권한을 허용해 주세요' : '내 위치를 가져오지 못했어요';
  }
  function setMode(mode) {
    if (state.mode === mode) return;
    state.mode = mode;
    animal = null; prevLevel = null; sensor.latest = { detected: false };
    document.querySelectorAll('[data-mode]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));
    $('testRow').hidden = mode !== 'test';
    if (mode === 'gps') { stopGps(); state.speed = 0; startGps(); }
    else { stopGps(); state.lat = 37.5645; state.lng = 126.9780; state.heading = 352; state.speed = +$('speedIn').value; state.headingKnown = true; }
    if (map) { map.setLevel(3); map.setCenter(new kakao.maps.LatLng(state.lat, state.lng)); }
  }

  /* ---------- 지도 ---------- */
  let map = null, carOv = null, carSvg = null, aOv = null, aEl = null, aPill = null, line = null, aShown = false, wasDetected = false;
  let routeLine = null, destOv = null;
  let lastMap = 0, lastFit = 0;

  function initMap() {
    if (map) return;
    $('setup').hidden = true;
    const kk = kakao.maps;
    map = new kk.Map($('map'), { center: new kk.LatLng(state.lat, state.lng), level: 3 });
    map.setDraggable(false);
    map.setZoomable(false);

    const carEl = document.createElement('div');
    carEl.className = 'car';
    carEl.innerHTML = '<svg viewBox="-30 -30 60 60" width="60" height="60" aria-hidden="true">' +
      '<circle r="26" fill="#2b6cff" opacity=".16"/>' +
      '<path d="M0-17L12 14 0 8-12 14Z" fill="#2b6cff" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg>';
    carSvg = carEl.firstChild;
    carOv = new kk.CustomOverlay({ position: map.getCenter(), content: carEl, xAnchor: 0.5, yAnchor: 0.5, zIndex: 10 });
    carOv.setMap(map);

    aEl = document.createElement('div');
    aEl.className = 'animal safe';
    aEl.innerHTML = '<div class="a-pill">--</div><div class="a-disc">🦌</div>';
    aPill = aEl.firstChild;
    aOv = new kk.CustomOverlay({ position: map.getCenter(), content: aEl, xAnchor: 0.5, yAnchor: 0.5, zIndex: 11 });

    line = new kk.Polyline({ path: [], strokeWeight: 4, strokeColor: COLORS.safe, strokeOpacity: 0.9, strokeStyle: 'dash' });

    places = new kk.services.Places();
    routeLine = new kk.Polyline({ path: [], strokeWeight: 6, strokeColor: '#02853b', strokeOpacity: 0.85 });
    const destEl = document.createElement('div');
    destEl.innerHTML = '<span class="dpin">📍</span>';
    destOv = new kk.CustomOverlay({ position: map.getCenter(), content: destEl, xAnchor: 0.5, yAnchor: 1, zIndex: 9 });

    syncMapSize();
  }
  function syncMapSize() { if (map) map.relayout(); }

  function updateMap(now) {
    if (!map || now - lastMap < 100) return;
    lastMap = now;
    const kk = kakao.maps;
    const carLL = new kk.LatLng(state.lat, state.lng);
    carOv.setPosition(carLL);
    carSvg.style.transform = 'rotate(' + state.heading + 'deg)';
    const p = sensor.latest;
    if (p.detected && animal) {
      const aLL = new kk.LatLng(animal.lat, animal.lng);
      const lvl = levelOf(p.distance);
      aOv.setPosition(aLL);
      if (!aShown) { aOv.setMap(map); line.setMap(map); aShown = true; }
      line.setPath([carLL, aLL]);
      line.setOptions({ strokeColor: COLORS[lvl] });
      aEl.className = 'animal ' + lvl;
      aPill.textContent = Math.round(p.distance) + 'm';
      if (now - lastFit > 400) {
        lastFit = now;
        const b = new kk.LatLngBounds();
        b.extend(carLL); b.extend(aLL);
        map.setBounds(b, 150, 60, 50, 60);
      }
      wasDetected = true;
    } else {
      if (aShown) { aOv.setMap(null); line.setMap(null); aShown = false; }
      if (wasDetected) { map.setLevel(3); wasDetected = false; }
      if (!(route && now - routeSetAt < 1500)) map.setCenter(carLL);
    }
  }

  /* ---------- 화면 정보(HUD) ---------- */
  const cache = new Map();
  function setText(node, v) { if (cache.get(node) !== v) { cache.set(node, v); node.textContent = v; } }
  function setClass(node, v) { const k = node.id + 'c'; if (cache.get(k) !== v) { cache.set(k, v); node.className = v; } }
  function updateHUD() {
    setText($('speedV'), String(Math.round(state.speed)));
    setText($('headV'), state.mode === 'gps' && !state.headingKnown ? '--' : dirName(state.heading));
    const p = sensor.latest;
    setText($('animalV'), p.detected ? Math.round(p.distance) + 'm' : '--');
    if (state.mode === 'test') {
      setText($('modeTitle'), '테스트 주행');
      setText($('modeSub'), state.paused ? '잠시 멈춰 있어요' : '가상 위치에서 달리는 중이에요');
    } else {
      setText($('modeTitle'), '내 위치(GPS)');
      setText($('modeSub'), state.gpsMsg || '내 위치를 찾는 중이에요');
    }
    const alertEl = $('alert');
    let edge = 'edge';
    if (p.detected) {
      const lvl = levelOf(p.distance);
      const d = Math.round(p.distance);
      const side = p.right < -2 ? '왼쪽' : p.right > 2 ? '오른쪽' : '도로 한가운데';
      alertEl.hidden = false;
      setClass(alertEl, 'alert ' + lvl);
      setText($('alertIco'), lvl === 'danger' ? '🚨' : lvl === 'warn' ? '⚠️' : '🦌');
      setText($('alertTitle'), lvl === 'danger' ? '전방 ' + d + 'm 위험, 감속하세요' : lvl === 'warn' ? '전방 ' + d + 'm 동물이 가까워요' : '전방 ' + d + 'm 야생동물 감지');
      setText($('alertSub'), '고라니가 ' + side + '에 있어요');
      if (lvl !== 'safe') edge = 'edge ' + lvl;
    } else alertEl.hidden = true;
    setClass($('edge'), edge);
  }

  /* ---------- 메인 루프 ---------- */
  let last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.1, (now - last) / 1000 || 0);
    last = now;
    if (state.mode === 'test' && !state.paused && state.speed > 0) {
      const v = state.speed / 3.6 * dt;
      const p = offsetLatLng(state.lat, state.lng, state.heading, v, 0);
      state.lat = p.lat; state.lng = p.lng;
    }
    computeSensor();
    alertFeedback(now);
    updateMap(now);
    updateHUD();
    updateTurn();
  }

  /* ---------- 버튼 ---------- */
  document.querySelectorAll('[data-mode]').forEach((b) => b.addEventListener('click', () => setMode(b.dataset.mode)));
  document.querySelectorAll('[data-side]').forEach((b) => b.addEventListener('click', () => {
    state.side = b.dataset.side;
    document.querySelectorAll('[data-side]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  }));
  $('destSearch').addEventListener('click', doSearch);
  $('destIn').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); doSearch(); } });
  $('destClear').addEventListener('click', clearRoute);
  $('spawnBtn').addEventListener('click', spawn);
  $('clearBtn').addEventListener('click', () => { animal = null; prevLevel = null; sensor.latest = { detected: false }; });
  $('speedIn').addEventListener('input', (e) => { state.speed = +e.target.value; $('speedOut').textContent = state.speed + 'km/h'; });
  $('turnL').addEventListener('click', () => { state.heading = (state.heading + 345) % 360; });
  $('turnR').addEventListener('click', () => { state.heading = (state.heading + 15) % 360; });
  $('pauseBtn').addEventListener('click', (e) => {
    state.paused = !state.paused;
    e.currentTarget.setAttribute('aria-pressed', String(state.paused));
    e.currentTarget.textContent = state.paused ? '출발' : '정지';
  });
  $('muteBtn').addEventListener('click', (e) => {
    ensureAudio();
    state.muted = !state.muted;
    e.currentTarget.textContent = state.muted ? '🔇' : '🔊';
    e.currentTarget.setAttribute('aria-pressed', String(state.muted));
    e.currentTarget.setAttribute('aria-label', state.muted ? '안내 소리 켜기' : '안내 소리 끄기');
    if (state.muted) { try { speechSynthesis.cancel(); } catch (err) { /* ignore */ } }
  });

  /* ---------- 지도 불러오기 / 처음 설정 ---------- */
  function getKey() {
    if (KAKAO_JS_KEY) return KAKAO_JS_KEY;
    try { return localStorage.getItem('kakaoJsKey') || ''; } catch (e) { return ''; }
  }
  function showSetup(msg) {
    $('setup').hidden = false;
    const origin = location.origin && location.origin !== 'null' ? location.origin : '';
    $('setupOrigin').textContent = origin || '지금은 파일로 열려 있어요. 웹 주소(https)로 올려서 열어야 지도가 보여요.';
    const err = $('setupErr');
    err.hidden = !msg;
    err.textContent = msg || '';
  }
  function loadSdk() {
    const key = getKey();
    if (!key) { showSetup(''); return; }
    let done = false;
    const fail = () => { if (!done) showSetup('지도를 불러오지 못했어요. 키가 맞는지, 위 주소를 JavaScript SDK 도메인에 등록했는지, 카카오맵 사용 설정이 ON인지 확인해 주세요.'); };
    const s = document.createElement('script');
    s.src = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey=' + encodeURIComponent(key) + '&autoload=false&libraries=services';
    s.onload = () => {
      if (!window.kakao || !kakao.maps) { fail(); return; }
      kakao.maps.load(() => { done = true; initMap(); });
    };
    s.onerror = fail;
    document.head.appendChild(s);
    setTimeout(fail, 8000);
  }
  $('keySave').addEventListener('click', () => {
    const v = $('keyIn').value.trim();
    if (!v) { showSetup('키를 붙여넣어 주세요.'); return; }
    try { localStorage.setItem('kakaoJsKey', v); } catch (e) { /* ignore */ }
    location.reload();
  });

  /* 아래 시트 높이에 맞춰 지도 영역 조정 */
  const sheet = $('sheet');
  function syncSheet() {
    document.documentElement.style.setProperty('--sheet-h', sheet.offsetHeight + 'px');
    syncMapSize();
  }
  if (window.ResizeObserver) new ResizeObserver(syncSheet).observe(sheet);
  window.addEventListener('resize', syncSheet);
  syncSheet();

  loadSdk();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
